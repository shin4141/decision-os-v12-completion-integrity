name: Validate Completion Records

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate PASS example
        run: python tools/v12_gate.py check examples/pass_example.json

      # DELAY and BLOCK are valid gate outputs.
      # These steps check that example records are structurally correct
      # and that declared gate_output matches inferred output.
      # A green check means the DELAY/BLOCK record is well-formed,
      # not that DELAY/BLOCK are failures.
      - name: Validate DELAY example
        run: python tools/v12_gate.py check examples/delay_example.json

      - name: Validate BLOCK example
        run: python tools/v12_gate.py check examples/block_example.json

      - name: Validate conditional PASS example
        run: python tools/v12_gate.py check examples/conditional_pass_example.json

      - name: Validate restartable local change example
        run: python tools/v12_gate.py check examples/pass.restartable_local_change.json

      - name: Validate missing stop conditions example
        run: python tools/v12_gate.py check examples/delay.missing_stop_conditions.json

      - name: Validate missing evidence anchor example
        run: python tools/v12_gate.py check examples/delay.missing_evidence_anchor.json

      - name: Validate owner visible pending example
        run: python tools/v12_gate.py check examples/delay.owner_visible_pending.json

      - name: Validate public missing rollback example
        run: python tools/v12_gate.py check examples/block.public_missing_rollback.json
