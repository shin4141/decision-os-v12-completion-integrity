name: Validate Completion Records

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate PASS example
        run: python tools/validate_completion_record.py examples/pass_example.json

      - name: Validate DELAY example
        run: python tools/validate_completion_record.py examples/delay_example.json

      - name: Validate BLOCK example
        run: python tools/validate_completion_record.py examples/block_example.json

      - name: Validate conditional PASS example
        run: python tools/validate_completion_record.py examples/conditional_pass_example.json
